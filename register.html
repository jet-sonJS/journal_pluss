<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up for Journal++</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Sign Up for Journal++</h1>
    <form action="create_account.php" method="post">      
        <label for="username">Username: </label>
        <input type="text" name="username" id="username" placeholder="e.g. jet-sonJS" required><br><br>

        <label for="email">Email: </label>
        <input type="email" name="email" id="email" placeholder="e.g. kieraswift@gmail.com" required><br><br>

        <label for="password">Password: </label>
        <input type="password" name="password" id="password" placeholder="e.g. P@ssw0rd123!" required><br><br>

        <button type="submit">Sign Up</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
